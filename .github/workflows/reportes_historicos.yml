name: Reportes historicos de los gigantes (laboratorio)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bajar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python reportes_historicos.py
      - run: |
          git config user.name "bot-nasdaq"
          git config user.email "bot-nasdaq@users.noreply.github.com"
          git add reportes_gigantes.csv
          git diff --cached --quiet || (git commit -m "Reportes historicos de los gigantes" && git pull -q --rebase && git push)
