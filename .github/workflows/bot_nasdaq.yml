name: Bot Nasdaq (demo)

# Lo lanza cron-job.org dos veces por día de bolsa (hora de Nueva York): 9:45 (tramo de la mañana) y 12:40 (tramo de la tarde).
# El bot decide solo qué tramo le toca según la hora. Si los dos coinciden, el de la tarde espera a que termine el de la mañana.
on:
  workflow_dispatch:
    inputs:
      prueba:
        description: 'Solo probar la conexion, sin operar'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: bot-nasdaq
  cancel-in-progress: false

jobs:
  contexto:
    # nasdaq.com bloquea a los servidores Windows de GitHub (403): el contexto se baja aquí, en Linux, y se pasa al bot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - run: python3 contexto.py
      - uses: actions/upload-artifact@v4
        with:
          name: contexto
          path: contexto/

  operar:
    needs: contexto
    if: always()
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar librerias
        run: python -m pip install --disable-pip-version-check -q MetaTrader5 pandas numpy tzdata

      - name: Instalar MetaTrader 5 de Tickmill
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $inst = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          Invoke-WebRequest -Uri 'https://download.terminal.free/cdn/web/19497/mt5/tickmill5setup.exe' -OutFile $inst
          Start-Process -FilePath $inst -ArgumentList '/auto'
          $t0 = Get-Date; $exe = $null
          while (-not $exe -and ((Get-Date) - $t0).TotalMinutes -lt 8) {
            Start-Sleep -Seconds 10
            $exe = Get-ChildItem 'C:\Program Files', 'C:\Program Files (x86)' -Filter terminal64.exe -Recurse -Depth 2 -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $exe) { throw 'No se instalo MetaTrader 5' }
          Start-Sleep -Seconds 30
          Get-Process -Name terminal64, mt5setup -ErrorAction SilentlyContinue | Stop-Process -Force
          Write-Host "MetaTrader 5 instalado en $($exe.FullName)"
          "MT5_PATH=$($exe.FullName)" >> $env:GITHUB_ENV

      - name: Abrir MetaTrader con la cuenta y Algo Trading activado
        shell: pwsh
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        run: |
          $ini = Join-Path $env:RUNNER_TEMP 'inicio_mt5.ini'
          $txt = "[Common]`r`nLogin=$env:MT5_LOGIN`r`nPassword=$env:MT5_PASSWORD`r`nServer=$env:MT5_SERVER`r`n" +
                 "[Experts]`r`nAllowLiveTrading=1`r`nAllowDllImport=0`r`nEnabled=1`r`nAccount=0`r`nProfile=0`r`n"
          [System.IO.File]::WriteAllText($ini, $txt, [System.Text.Encoding]::Unicode)
          Start-Process -FilePath $env:MT5_PATH -ArgumentList "/config:`"$ini`""
          Start-Sleep -Seconds 60
          Remove-Item $ini -Force

      - name: Traer el contexto bajado en Linux
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: contexto
          path: ctx_linux

      - name: Usar ese contexto (si no llegó, bajarlo aquí)
        continue-on-error: true
        timeout-minutes: 3
        shell: pwsh
        run: |
          if (Test-Path ctx_linux/hoy.json) { Copy-Item ctx_linux/* contexto/ -Force; Write-Host 'Contexto de Linux'; Get-Content contexto/hoy.json -TotalCount 3 }
          else { python contexto.py }

      - name: Correr el bot (un tramo del dia)
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          GH_TOKEN: ${{ github.token }}
          PYTHONIOENCODING: utf-8
          PRUEBA: ${{ inputs.prueba }}
        shell: bash
        run: if [ "$PRUEBA" = "true" ]; then python bot_nasdaq.py --prueba; else python bot_nasdaq.py; fi

      - name: Guardar la bitacora en el repositorio
        if: always() && inputs.prueba != true
        shell: bash
        run: |
          git config user.name "bot-nasdaq"
          git config user.email "bot-nasdaq@users.noreply.github.com"
          for f in bitacora_nasdaq.csv estado_nasdaq.json contexto; do if [ -e $f ]; then git add $f; fi; done
          git diff --cached --quiet || (git commit -m "Bitacora y estado Nasdaq $(date -u +%Y-%m-%d)" && git pull -q --rebase && git push)
